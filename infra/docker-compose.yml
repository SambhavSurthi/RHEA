services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rhea}
      POSTGRES_USER: ${POSTGRES_USER:-rhea}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rhea-demo}
    ports:
      - "${RHEA_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rhea} -d ${POSTGRES_DB:-rhea}"]
      interval: 5s
      timeout: 5s
      retries: 12

  neo4j:
    image: neo4j:5.26.29-community
    environment:
      NEO4J_AUTH: neo4j/rhea-demo
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file: ../.env
    environment:
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      RHEA_POSTGRES_DSN: postgresql+psycopg://${POSTGRES_USER:-rhea}:${POSTGRES_PASSWORD:-rhea-demo}@postgres:5432/${POSTGRES_DB:-rhea}
      RHEA_OBJECT_STORE_PATH: /app/storage/objects
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    environment:
      RAG_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  neo4j_data:
  qdrant_data:
  postgres_data:
